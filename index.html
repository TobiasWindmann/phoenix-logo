<meta charset="utf-8">
<title>TRICEPT Phoenix — Logo Animation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --lime:#11ef94;
    --bg:#070a09;
    --ink:#cfe9df;

    /* alles proportional zur Logohöhe -> responsiv */
    --h: clamp(46px, 12.5vw, 150px);
    --gap: calc(var(--h) * 0.46);
    --wm-w: calc(var(--h) * 3.9499);            /* 895.731 / 226.772 */
    --offset: calc((var(--wm-w) + var(--gap)) / 2);
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:"Sora",system-ui,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(60% 60% at 50% 42%, rgba(17,239,148,.10), transparent 70%),
      var(--bg);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:100svh;
    overflow:hidden;
    transition:background .4s ease,color .4s ease;
  }
  /* dezenter Grid-Layer */
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;
    background-image:
      linear-gradient(to right, rgba(17,239,148,.05) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(17,239,148,.05) 1px, transparent 1px);
    background-size:42px 42px;
    -webkit-mask-image:radial-gradient(70% 70% at 50% 45%,#000,transparent);
            mask-image:radial-gradient(70% 70% at 50% 45%,#000,transparent);
  }

  body.light{
    --bg:#f4f7f5;
    --ink:#0c211a;
    background:
      radial-gradient(60% 60% at 50% 42%, rgba(17,239,148,.18), transparent 70%),
      var(--bg);
  }

  .scene{ position:relative; z-index:1; }

  .lockup{
    display:flex;
    align-items:center;
    gap:var(--gap);
    width:max-content;
    /* Startposition: Bildmarke sitzt in der Mitte der Bühne */
    transform:translateX(calc(-1 * var(--offset)));
  }

  .icon{ width:var(--h); height:var(--h); flex:0 0 auto; }
  .icon svg{ width:100%; height:100%; display:block; }

  .wordmark{ height:var(--h); flex:0 0 auto; opacity:0; }
  .wordmark svg{ height:100%; width:auto; display:block; }

  /* Bildmarken-Flügel anfänglich versteckt */
  .icon path{ opacity:0; transform-box:fill-box; transform-origin:center; }
  .b1{ --tx:0%;    --ty:-135%; --fr:-115deg; }
  .b2{ --tx:-135%; --ty:55%;   --fr:125deg;  }
  .b3{ --tx:0%;    --ty:135%;  --fr:-95deg;  }

  /* ---------- ABLAUF (nur bei .play aktiv -> replaybar) ---------- */
  .scene.play .b1{ animation:blade .80s cubic-bezier(.34,1.56,.64,1) .10s both; }
  .scene.play .b2{ animation:blade .80s cubic-bezier(.34,1.56,.64,1) .28s both; }
  .scene.play .b3{ animation:blade .80s cubic-bezier(.34,1.56,.64,1) .46s both; }

  .scene.play .icon    { animation:pop  .55s ease 1.18s both; }
  .scene.play .icon svg{ animation:glow .80s ease 1.18s both; }

  .scene.play .lockup  { animation:moveRight .85s cubic-bezier(.2,.75,.25,1) 1.75s both; }
  .scene.play .wordmark{ animation:wmIn .70s cubic-bezier(.2,.7,.2,1) 2.32s both; }

  @keyframes blade{
    0%  { opacity:0; transform:translate(var(--tx),var(--ty)) rotate(var(--fr)) scale(.18); }
    55% { opacity:1; }
    100%{ opacity:1; transform:translate(0,0) rotate(0) scale(1); }
  }
  @keyframes pop{
    0%{transform:scale(1)} 45%{transform:scale(1.07)} 100%{transform:scale(1)}
  }
  @keyframes glow{
    0%  { filter:drop-shadow(0 0 0 rgba(17,239,148,0)) brightness(1); }
    35% { filter:drop-shadow(0 0 22px rgba(17,239,148,.95)) brightness(1.35); }
    100%{ filter:drop-shadow(0 0 5px rgba(17,239,148,.30)) brightness(1); }
  }
  @keyframes moveRight{
    from{ transform:translateX(calc(-1 * var(--offset))); }
    to  { transform:translateX(0); }
  }
  @keyframes wmIn{
    from{ opacity:0; transform:translateX(-26px); }
    to  { opacity:1; transform:translateX(0); }
  }

  /* ---------- Controls ---------- */
  .controls{
    position:fixed; bottom:28px; left:50%; transform:translateX(-50%);
    display:flex; gap:10px; z-index:3;
  }
  .controls button{
    font:600 13px/1 "Sora",system-ui,sans-serif;
    letter-spacing:.04em;
    color:var(--bg);
    background:var(--lime);
    border:0; border-radius:999px;
    padding:11px 20px; cursor:pointer;
    transition:transform .15s ease, box-shadow .2s ease, opacity .2s ease;
    box-shadow:0 6px 24px rgba(17,239,148,.30);
  }
  .controls button.ghost{
    color:var(--lime); background:transparent;
    border:1px solid rgba(17,239,148,.45);
    box-shadow:none;
  }
  .controls button:hover{ transform:translateY(-2px); }
  .controls button:active{ transform:translateY(0); }

  @media (prefers-reduced-motion: reduce){
    .scene.play *{ animation-duration:.001s !important; }
  }
</style>

<div class="controls">
  <button id="replay">▶ Replay</button>
  <button class="ghost" id="bg">Hintergrund</button>
</div>

<script>
  const scene = document.getElementById('scene');
  function play(){
    scene.classList.remove('play');
    void scene.offsetWidth;        // Reflow erzwingen -> Animationen neu starten
    scene.classList.add('play');
  }
  document.getElementById('replay').addEventListener('click', play);
  document.getElementById('bg').addEventListener('click', ()=>document.body.classList.toggle('light'));
  window.addEventListener('load', play);
</script>
